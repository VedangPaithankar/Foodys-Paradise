spring.application.name=FoodysParadiseBackend

# Postgres (phase5-postgres-1 container, port 5435 on host -- 5434/6380 are Phase 4's ports)
spring.datasource.url=jdbc:postgresql://localhost:5435/foodys_paradise
spring.datasource.username=foodys_paradise
spring.datasource.password=foodys_paradise

# Flyway owns the schema (see src/main/resources/db/migration). Hibernate only
# validates entities against it -- it never issues DDL itself. This is the one
# deliberate difference from Phase 4 (which used ddl-auto=update as a "get it
# working" shortcut); the field renames coming out of the Mongo migration
# deserve a reviewable, versioned schema instead.
# Explicit spring.flyway.enabled=true: Spring Boot 4.1.0's autoconfiguration
# did not pick up flyway-core automatically when this was left unset --
# migrations silently never ran and Hibernate validation failed instead.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# JWT -- ${JWT_SECRET:...} keeps the dev default for local/docker-compose use
# but lets deployment override it with a real secret via env var, same
# pattern as Phase 4/BrewFlow.
jwt.secret=${JWT_SECRET:8qQnzM3Jv1t7NnG0e5b8yqe0wq0i5nQF6dEwqJ7T3zE=}
jwt.expiration-ms=86400000

# ML recommender microservice (FastAPI, ml-service/)
ml.service.base-url=${ML_SERVICE_BASE_URL:http://localhost:8000}

# CORS -- see SecurityConfig. Comma-separated list of allowed frontend
# origins; ALLOWED_ORIGINS is set to the real deployed frontend URL in prod.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
